apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  # ACR의 helm/ 경로에 있는 OCI Helm 차트만 소스로 허용합니다.
  sourceRepos:
    - ACR_LOGIN_SERVER/helm
  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Rollout
    - group: ''
      kind: Service
