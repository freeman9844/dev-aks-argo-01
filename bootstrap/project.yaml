apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: demo
  namespace: argocd
spec:
  # ACR의 helm/ 경로에 있는 OCI Helm 차트만 소스로 허용합니다.
  sourceRepos:
    - ACR_LOGIN_SERVER/helm
  destinations:
    - namespace: demo
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Rollout
    - group: ''
      kind: Service
    # 차트는 Rollout과 Service만 만듭니다. 아래 두 종류는 Rollout이 만드는 자식입니다.
    # 허용하지 않으면 Argo CD UI 트리에서 ReplicaSet과 Pod가 숨겨집니다.
    - group: apps
      kind: ReplicaSet
    - group: ''
      kind: Pod
