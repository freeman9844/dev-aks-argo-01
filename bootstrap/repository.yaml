# 04 단계에서 UI의 CONNECT REPO가 동작하지 않을 때 쓰는 대체 경로입니다.
# 비밀 값은 없습니다. repo-server가 워크로드 ID(관리 ID)로 ACR 토큰을 받습니다.
apiVersion: v1
kind: Secret
metadata:
  name: acr-helm
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: helm
  name: acr-helm
  url: ACR_LOGIN_SERVER/helm
  enableOCI: 'true'
  useAzureWorkloadIdentity: 'true'
