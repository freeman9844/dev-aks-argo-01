trigger:
  batch: true
  branches:
    include: [main]

pool:
  vmImage: ubuntu-24.04

jobs:
  # CI: 테스트 → 이미지 빌드·푸시 → 이미지 digest를 박은 Helm 차트를 ACR(helm/)에 푸시
  - job: Build
    steps:
      - checkout: self
      - bash: python3 -m unittest discover -s tests -v
        displayName: Test app and chart
      - task: AzureCLI@2
        name: publish
        displayName: Push image and Helm chart to ACR
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        inputs:
          azureSubscription: demo-acr-push
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            az acr login --name "$ACR_NAME"
            tag="$BUILD_SOURCEVERSION-$BUILD_BUILDID"
            image="$ACR_LOGIN_SERVER/demo-app:$tag"
            docker build --build-arg SOURCE_COMMIT="$BUILD_SOURCEVERSION" -t "$image" .
            docker push "$image"
            digest=$(az acr repository show -n "$ACR_NAME" --image "demo-app:$tag" --query digest -o tsv)
            echo "$BUILD_SOURCEVERSION -> $image -> $digest"

            python3 ci/set_chart_image.py chart/demo-app "$ACR_LOGIN_SERVER/demo-app" "$digest"
            version="1.0.$BUILD_BUILDID"
            helm package chart/demo-app --version "$version" --app-version "${BUILD_SOURCEVERSION:0:7}" -d "$AGENT_TEMPDIRECTORY"
            az acr login --name "$ACR_NAME" --expose-token --query accessToken -o tsv \
              | helm registry login "$ACR_LOGIN_SERVER" --username 00000000-0000-0000-0000-000000000000 --password-stdin
            helm push "$AGENT_TEMPDIRECTORY/demo-app-$version.tgz" "oci://$ACR_LOGIN_SERVER/helm"
            echo "chart: oci://$ACR_LOGIN_SERVER/helm/demo-app:$version"
            echo "##vso[task.setvariable variable=chartVersion;isOutput=true]$version"
        env:
          ACR_NAME: $(acrName)
          ACR_LOGIN_SERVER: $(acrLoginServer)

  # CD 호출: Argo CD에 "이 차트 버전으로 Sync"를 요청합니다. 실제 배포는 Argo CD가 합니다.
  - job: Deploy
    dependsOn: Build
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      chartVersion: $[ dependencies.Build.outputs['publish.chartVersion'] ]
    steps:
      - checkout: none
      - bash: |
          set -euo pipefail
          curl -fsSLk -o argocd "https://$ARGOCD_SERVER/download/argocd-linux-amd64"
          chmod +x argocd
          ./argocd version --client --short
          # 토큰·주소가 틀리면 여기서 실패합니다(아래 '앱 없음' 경고와 구분).
          ./argocd account get-user-info
          if ! ./argocd app get demo-app > /dev/null; then
            echo "##vso[task.logissue type=warning]Argo CD Application demo-app이 아직 없습니다. 04 단계에서 Application을 만든 뒤 파이프라인을 다시 실행하세요. (차트 $CHART_VERSION 은 ACR에 푸시됨)"
            exit 0
          fi
          ./argocd app set demo-app --revision "$CHART_VERSION"
          ./argocd app sync demo-app --async
          # Sync 작업 완료까지만 기다립니다. 카나리는 첫 단계에서 정지(Suspended)하므로 health는 기다리지 않습니다.
          ./argocd app wait demo-app --sync --operation --timeout 300
          ./argocd app get demo-app
        displayName: Request Argo CD sync
        env:
          ARGOCD_SERVER: $(argocdServer)
          ARGOCD_AUTH_TOKEN: $(argocdToken)
          ARGOCD_OPTS: --insecure --grpc-web
          CHART_VERSION: $(chartVersion)
